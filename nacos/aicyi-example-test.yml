# Nacos dataId: aicyi-example-test.yml
# group: DEFAULT_GROUP，格式：YAML
# test 环境配置（由 application-test.yml 迁移而来）

aicyi:
  snowflake:
    enabled: true
    service-name: default-service
    worker-id-bits: 5
    datacenter-id: 0
    ttl-seconds: 60
    heartbeat-seconds: 20
    auto-recover: true
    clock-backward-tolerance-ms: 5
    epoch: 1672531200000

  token:
    enabled: true
    # JWT 签名密钥属高敏感凭证，禁止写入配置中心/仓库；必须由部署环境变量注入，
    # 未注入时占位符无法解析，应用启动即失败（fail-fast），避免带着默认密钥上线
    secret-key: ${AICYI_TOKEN_SECRET_KEY}
    issuer: Leon
    subject: example
    principal-type: io.github.aicyi.example.domain.bo.UserInfo
    # Duration 裸数字默认按毫秒绑定，必须显式带单位，否则 86400 会被解析为 86.4 秒
    refresh-token-ttl: 2592000s   # 30 天
    access-token-ttl: 86400s      # 1 天
    multi-token-allowed: false
    key-prefix: aicyi-token
    principal-claim-fields: userId,username,deviceId

  message:
    email:
      host: smtp.163.com
      port: -1
      # 第三方 SaaS 凭证（SMTP 授权码 / Twilio AuthToken）一律无默认值，
      # 只能由部署环境变量注入；缺省即启动失败，不降级为可猜测的弱凭证
      username: ${MAIL_USERNAME:minlc1024@163.com} # your-account@example.com
      password: ${MAIL_PASSWORD} # your-smtp-auth-code
      from-name: minliangchao

    sms:
      provider: default
      # Account SID 与 AuthToken 成对构成 Twilio 访问凭证，同样不提供默认值
      username: ${SMS_ACCOUNT_SID} # your-sms-account-sid
      password: ${SMS_AUTH_TOKEN} # your-sms-auth-token
      from: ${SMS_FROM_NUMBER} # +10000000000

    mq:
      provider: rabbitMq

    operate-log:
      enabled: true
      storage:
        type: db